[project]
name = "p003-drill-adapter"
version = "1.0.0"
description = "P003 local drill adapter: receipt protocol, whitelist, port audit, verdict (contract v1)"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]