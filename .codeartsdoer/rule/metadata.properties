projectExpert=[{"filePath":"项目协作公约.mdc","name":"项目协作公约","description":"项目协作与网络行为公约 全程自动应用","content":"1. 全程规范驱动开发（SDD）：先规格后动作，禁跳阶段。\n2. 学不会禁开工：新框架先拉取并修复至可运行；学 5 论文+5 项目，考核 100% 作答且自信度达 80% 才准干。\n3. 学习材料门槛：项目只学大厂高引用的框架（禁 hello world、禁开发工具类）；论文只学近 1 年智能体方向且保真度要准；引用前必评质量与相关性。\n4. 参考仓库整库存项目外隔离目录，禁 submodule、禁仓库嵌套进本项目，只读引用。\n5. 规矩层冻结：七节公约为锚点零改动；分层/注册表/触发归领域与业务层。\n6. 禁自建定时任务：一切触发走事件（注入/消息/diff/动作检查点/后台任务）。\n7. 项目核心状态只存 notes/项目事实表.md 一处，他处活引用不抄值。\n8. 信息源冲突按序仲裁：规则 > 知识库最新文档 > 记忆 > 自行推断；冲突必报告。\n9. 新功能先登记再使用：生成 SKILL（触发条件写进描述）、注册表登记六要素、记变更日志。\n10. 编码必审：只要写代码就跑质量审查（P3C 规约为底），未过不完工、结果必留痕","triggerType":"always","source":"project","absolutePath":"c:\\Users\\Administrator\\Desktop\\Date\\.codeartsdoer\\rule\\项目协作公约.mdc"}]
