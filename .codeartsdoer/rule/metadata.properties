projectExpert=[{"filePath":"项目协作公约.mdc","name":"项目协作公约","description":"项目协作与网络行为公约 全程自动应用","content":"一、协作：不确定就停，禁猜禁编；能程序化的进代码与配置，不写在此处；临时步骤只活在当前派工单，干完即弃。\n二、沟通：给刚好够的信息；结论前置；只围绕当前任务；上下文断了先问清再动手。\n三、文件禁改：未经我批准禁改 AGENTS.md 与本规则；操作前先说明意图，越权事项先问后动。\n四、提交纪律：禁全量暂存，精确暂存，提交前过门禁。\n五、经验复用：踩坑按观察/已验证/约定分级，约定须我确认。\n六、网络操作：失败先报原文错误，禁盲目重试或自作主张换源；拉取必须用标准工具命令，禁自造 HTTP 或网页拉取。\n七、优先级：同名规则按官方优先级生效——云端企业级 > 云端团队级 > 本地项目级 > 本地个人级 > 云端个人级；本项目未接入云端规则时，冲突一律以本地项目级为准。","triggerType":"always","source":"project","absolutePath":"c:\\Users\\Administrator\\Desktop\\Date\\.codeartsdoer\\rule\\项目协作公约.mdc"}]
